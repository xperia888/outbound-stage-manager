<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ONUS-ONT Outbound Pallet Staging Manager v2</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-alt: #273549;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --purple: #8b5cf6;
    --cyan: #06b6d4;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.4;
    padding-bottom: 50px;
  }

  /* Header */
  .topbar {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-badge {
    background: var(--primary);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }

  .brand-title {
    font-size: 17px;
    font-weight: 700;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  .topbar-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .sync-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--warning);
  }
  .sync-dot.online { background: var(--success); }
  .sync-dot.error { background: var(--danger); }

  /* Buttons */
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  button:active { transform: scale(0.98); }

  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { filter: brightness(1.08); }
  .btn-warning { background: var(--warning); color: #0f172a; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-ghost {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--panel-alt); }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
  .btn-xs { padding: 3px 7px; font-size: 11px; border-radius: 5px; }

  /* Container */
  .container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 14px 16px;
  }

  /* Alert Banner */
  .alert-banner {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid var(--danger);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .alert-banner.visible { display: flex; }
  .alert-text {
    color: #fca5a5;
    font-size: 13px;
    font-weight: 600;
  }

  /* KPI Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .kpi-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }

  .kpi-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .kpi-val {
    font-size: 22px;
    font-weight: 800;
  }

  .kpi-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* Navigation Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .tab-btn {
    background: var(--panel);
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }

  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Quick Scan Bar */
  .scan-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .scan-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 10px;
    align-items: end;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field-group label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  input, select, textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 11px;
    border-radius: 8px;
    font-size: 14px;
    width: 100%;
    outline: none;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 10px;
    font-size: 13px;
    cursor: pointer;
  }

  .checkbox-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
  }

  /* Filter & Search Bar */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .search-wrap {
    flex: 1;
    min-width: 220px;
    max-width: 420px;
  }

  .filter-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .pill.active {
    background: var(--panel-alt);
    color: #fff;
    border-color: var(--primary);
  }

  /* Lane Grid */
  .lane-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 12px;
  }

  .lane-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.2s;
  }

  .lane-card.has-overdue {
    border-color: var(--danger);
    box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.35);
  }

  .lane-card.is-full {
    border-color: var(--warning);
  }

  .lane-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .lane-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .lane-code {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
  }

  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    text-transform: uppercase;
  }

  .badge-carrier { background: rgba(6, 182, 212, 0.18); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.4); }
  .badge-dock { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.4); }
  .badge-overdue { background: var(--danger); color: #fff; }
  .badge-stack { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }
  .badge-order { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }

  .cap-bar-wrap {
    background: var(--bg);
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .cap-bar-fill {
    height: 100%;
    background: var(--success);
    transition: width 0.25s ease;
  }
  .cap-bar-fill.warn { background: var(--warning); }
  .cap-bar-fill.full { background: var(--danger); }

  .pallet-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 260px;
    overflow-y: auto;
  }

  .pallet-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .pallet-item.overdue {
    border-left: 4px solid var(--danger);
    background: rgba(239, 68, 68, 0.08);
  }

  .pallet-main {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .pallet-id {
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    word-break: break-all;
  }

  .pallet-meta {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .pallet-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .empty-lane {
    text-align: center;
    padding: 18px 10px;
    color: var(--text-muted);
    font-size: 12px;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  /* Dock Cards */
  .dock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 12px;
  }

  .dock-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }

  /* Tables */
  .table-wrap {
    overflow-x: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  th {
    background: var(--panel-alt);
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
  }

  /* Modals */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 999;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 520px;
    padding: 18px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title { font-size: 16px; font-weight: 800; }

  .toast {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background
