<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ONUS-ONT Outbound Pallet Staging Manager v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }
    .lane-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 0.85rem;
    }
    @media (max-width: 640px) {
      .lane-grid {
        grid-template-columns: 1fr;
        gap: 0.65rem;
      }
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
    }
    .modal-backdrop.is-open {
      display: flex;
    }
    .pallet-card {
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .pallet-card:active {
      transform: scale(0.99);
    }
    .lane-drop-active {
      outline: 2px dashed #2563eb;
      outline-offset: 2px;
      background-color: #eff6ff !important;
    }
    .lane-highlight-pulse {
      animation: pulseRing 1.4s ease-in-out 2;
    }
    @keyframes pulseRing {
      0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
      50% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0.35); }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP HEADER BAR -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-[1600px] mx-auto px-3 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <!-- Brand & Version -->
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center font-black text-sm tracking-tight shadow-inner">
          ONT
        </div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-sm sm:text-base font-bold tracking-tight leading-none">
              ONUS-ONT Outbound Pallet Staging
            </h1>
            <span class="px-1.5 py-0.5 text-[11px] font-bold rounded bg-blue-500/20 text-blue-300 border border-blue-400/30">
              v2
            </span>
            <button
              id="cloud-sync-pill"
              type="button"
              onclick="openCloudConfigModal()"
              title="Click to configure Google Apps Script Cloud Sync URL"
              class="px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-slate-800 text-slate-200 border border-slate-600 hover:bg-slate-700 flex items-center gap-1.5 transition cursor-pointer"
            >
              <span id="cloud-sync-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
              <span id="cloud-sync-label">Local Only</span>
            </button>
          </div>
          <p class="text-[11px] text-slate-400 mt-0.5">
            Floor Footprint &amp; Double-Stack (2x) Staging Board
          </p>
        </div>
      </div>

      <!-- KPI Strip -->
      <div class="flex items-center gap-2 sm:gap-3 text-xs">
        <div class="bg-slate-800/90 border border-slate-700/80 rounded-lg px-2.5 py-1 text-center">
          <div class="text-[10px] uppercase tracking-wider text-slate-400">Pallets</div>
          <div id="stat-total-pallets" class="font-bold text-white text-sm leading-tight">0</div>
        </div>
        <div class="bg-slate-800/90 border border-slate-700/80 rounded-lg px-2.5 py-1 text-center">
          <div class="text-[10px] uppercase tracking-wider text-slate-400">Floor Spots</div>
          <div id="stat-floor-spots" class="font-bold text-emerald-400 text-sm leading-tight">0 / 120</div>
        </div>
        <div class="bg-slate-800/90 border border-slate-700/80 rounded-lg px-2.5 py-1 text-center">
          <div class="text-[10px] uppercase tracking-wider text-slate-400">2x Stacked</div>
          <div id="stat-double-stacked" class="font-bold text-indigo-300 text-sm leading-tight">0</div>
        </div>
        <button
          id="aging-alert-btn"
          type="button"
          onclick="openAgingModal()"
          class="bg-slate-800/90 border border-slate-700/80 hover:border-amber-500/60 rounded-lg px-2.5 py-1 text-center transition cursor-pointer"
          title="View pallets staged over 7 days"
        >
          <div class="text-[10px] uppercase tracking-wider text-slate-400">Aging &gt;7d</div>
          <div id="stat-aging-count" class="font-bold text-slate-300 text-sm leading-tight">0</div>
        </button>
      </div>

      <!-- Primary Action Toolbar -->
      <div class="flex items-center gap-1.5 flex-wrap">
        <button
          type="button"
          onclick="openScannerModal()"
          class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition cursor-pointer"
        >
          <i class="fa-solid fa-barcode"></i>
          <span>Multi-SLP Scan</span>
        </button>

        <button
          type="button"
          onclick="openConsolidateModal()"
          class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-xs font-semibold px-2.5 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition cursor-pointer"
          title="Find tight-fit lane consolidation moves"
        >
          <i class="fa-solid fa-compress-arrows-alt"></i>
          <span>Consolidate</span>
        </button>

        <button
          type="button"
          onclick="openBatchAddModal()"
          class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium px-2.5 py-2 rounded-lg flex items-center gap-1.5 transition cursor-pointer"
          title="Batch add staging lanes"
        >
          <i class="fa-solid fa-layer-group"></i>
          <span>Batch</span>
        </button>

        <button
          type="button"
          onclick="exportEodCsv()"
          class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium px-2.5 py-2 rounded-lg flex items-center gap-1.5 transition cursor-pointer"
          title="Download End-of-Day CSV report"
        >
          <i class="fa-solid fa-file-csv text-emerald-400"></i>
          <span class="hidden sm:inline">EOD Report</span>
        </button>

        <button
          type="button"
          onclick="openBackupModal()"
          class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium px-2.5 py-2 rounded-lg flex items-center gap-1.5 transition cursor-pointer"
          title="JSON Backup, Restore & Cloud Endpoint"
        >
          <i class="fa-solid fa-cloud-arrow-up text-sky-400"></i>
          <span class="hidden md:inline">Backup / Cloud</span>
        </button>
      </div>
    </div>
  </header>

  <!-- QUICK SCAN & FILTER BAR -->
  <section class="bg-white border-b border-slate-200 shadow-sm sticky top-[56px] z-20">
    <div class="max-w-[1600px] mx-auto px-3 py-2 flex flex-wrap items-center gap-2">
      <!-- Quick Single-Line Scan Form -->
      <form onsubmit="handleQuickScanSubmit(event)" class="flex flex-wrap items-center gap-1.5 flex-1 min-w-[280px]">
        <div class="relative flex-1 min-w-[140px] max-w-[210px]">
          <i class="fa-solid fa-qrcode absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input
            id="quick-slp-input"
            type="text"
            placeholder="Scan SLP / LPN..."
            autocomplete="off"
            class="w-full pl-7 pr-2 py-1.5 text-xs font-mono font-semibold bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
          />
        </div>

        <input
          id="quick-order-input"
          type="text"
          placeholder="Order / SO #"
          oninput="updateQuickAutoSuggestBadge()"
          autocomplete="off"
          class="w-28 sm:w-32 px-2.5 py-1.5 text-xs font-semibold bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
        />

        <input
          id="quick-carrier-input"
          type="text"
          placeholder="Carrier (opt)"
          autocomplete="off"
          class="w-24 sm:w-28 px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
        />

        <select
          id="quick-lane-select"
          class="px-2 py-1.5 text-xs font-semibold bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="AUTO">Auto-Suggest Lane</option>
        </select>

        <label class="inline-flex items-center gap-1 px-2 py-1.5 text-xs font-semibold bg-indigo-50 text-indigo-800 border border-indigo-200 rounded-lg cursor-pointer select-none">
          <input id="quick-double-checkbox" type="checkbox" onchange="updateQuickAutoSuggestBadge()" class="rounded text-indigo-600 focus:ring-indigo-500" />
          <span>2x Stack</span>
        </label>

        <button
          type="submit"
          class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition cursor-pointer"
        >
          + Stage
        </button>

        <span
          id="quick-auto-suggest-badge"
          class="text-[11px] font-medium text-slate-600 bg-slate-100 border border-slate-200 px-2 py-1 rounded-md hidden xl:inline-flex items-center gap-1"
        >
          Suggest: <strong class="text-blue-700">S51</strong>
        </span>
      </form>

      <!-- Search & Carrier Filter -->
      <div class="flex items-center gap-1.5 w-full sm:w-auto justify-end">
        <div class="relative flex-1 sm:w-48">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input
            id="board-search-input"
            type="text"
            placeholder="Search SLP, Order, Dock..."
            oninput="renderBoard()"
            class="w-full pl-7 pr-6 py-1.5 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <button
            type="button"
            onclick="document.getElementById('board-search-input').value=''; renderBoard();"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs"
            title="Clear search"
          >
            &times;
          </button>
        </div>

        <select
          id="carrier-filter-select"
          onchange="renderBoard()"
          class="px-2 py-1.5 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="ALL">All Carriers</option>
        </select>

        <select
          id="status-filter-select"
          onchange="renderBoard()"
          class="px-2 py-1.5 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="ALL">All Lanes</option>
          <option value="ACTIVE">Occupied Only</option>
          <option value="EMPTY">Empty Only</option>
          <option value="NEAR_FULL">&le;2 Spots Left</option>
          <option value="AGING">Aging (&gt;7d)</option>
        </select>
      </div>
    </div>
  </section>

  <!-- MAIN STAGING LANES BOARD -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto px-3 py-3">
    <div id="staging-board" class="lane-grid"></div>
  </main>

  <!-- TOAST NOTIFICATION -->
  <div
    id="toast-banner"
    style="display:none;"
    class="fixed bottom-4 right-4 z-50 max-w-sm bg-slate-900 text-white text-xs font-medium px-3.5 py-2.5 rounded-xl shadow-lg border border-slate-700 items-center gap-2"
  >
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toast-message">Saved</span>
  </div>

  <!-- MODAL 1: MULTI-SLP SCANNER MODAL -->
  <div id="scanner-modal" class="modal-backdrop" onclick="if(event.target===this) closeModal('scanner-modal')">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden">
      <div class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-barcode text-blue-400"></i>
          <h2 class="font-bold text-sm">Multi-SLP Order Batch Scanner</h2>
        </div>
        <button type="button" onclick="closeModal('scanner-modal')" class="text-slate-400 hover:text-white text-lg leading-none cursor-pointer">&times;</button>
      </div>

      <div class="p-4 space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-600 mb-1">1. Order / SO Number *</label>
            <input
              id="scanner-order-input"
              type="text"
              placeholder="Scan or type Order #"
              oninput="updateScannerAutoSuggestPill()"
              onkeydown="if(event.key==='Enter'){ event.preventDefault(); document.getElementById('scanner-slp-input').focus(); }"
              class="w-full px-3 py-2 text-sm font-bold border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-600 mb-1">Carrier / SCAC</label>
            <input
              id="scanner-carrier-input"
              type="text"
              placeholder="e.g., FEDEX, UPS, XPO"
              onkeydown="if(event.key==='Enter'){ event.preventDefault(); document.getElementById('scanner-slp-input').focus(); }"
              class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 items-end">
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-600 mb-1">Target Staging Lane</label>
            <select
              id="scanner-lane-select"
              onchange="updateScannerAutoSuggestPill()"
              class="w-full px-3 py-2 text-sm font-semibold border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="AUTO">Auto-Suggest (Same Order / Empty First)</option>
            </select>
          </div>
          <div class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
            <label class="inline-flex items-center gap-2 text-xs font-bold text-indigo-800 cursor-pointer">
              <input id="scanner-double-checkbox" type="checkbox" onchange="updateScannerAutoSuggestPill()" class="rounded text-indigo-600" />
              <span>Double-Stack (2x High)</span>
            </label>
            <span id="scanner-auto-suggest-pill" class="text-[11px] font-bold text-blue-700 bg-blue-50 px-2
